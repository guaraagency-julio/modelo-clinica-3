name: Publicar modelo Nexo no GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Preparar site estático
        run: |
          mkdir -p dist
          cp index.html styles.css app.js favicon.svg dist/
          touch dist/.nojekyll
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publicar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - id: deployment
        name: Implantar GitHub Pages
        uses: actions/deploy-pages@v4
